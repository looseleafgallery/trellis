[project]
# The import, the command and the tool are all `trellis`; only the
# distribution differs, because `trellis` on PyPI is an abandoned 2008
# alpha for something unrelated. See TRE-6.
name = "trellis-kernel"
version = "0.1.0"
description = "Compute project state from a graph of work, gates, and contracts."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# The engine needs none of this; only `trellis log` does.
llm = ["anthropic>=0.69", "pydantic>=2.0"]
dev = ["pytest>=8.0", "anthropic>=0.69", "pydantic>=2.0"]

[project.scripts]
trellis = "trellis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trellis*"]

# The operating manual ships with the package. An agent working in someone
# else's repo has `trellis` installed and no copy of this repository, so
# without this the only way to learn the grammar is to go and read the source
# of a project you are not working on. See `trellis brief`.
[tool.setuptools.package-data]
trellis = ["manual.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Assigning a lambda is fine in the small places we do it.
    "E731",
]

[tool.ruff.lint.pycodestyle]
# ruff format wraps code to 88; only unsplittable strings and comments run over.
max-line-length = 92

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures and modules late on purpose, and shadow names freely.
"tests/*" = ["E402", "F811"]
