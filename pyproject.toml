[project]
# The import, the command and the tool are all `trellis`; only the
# distribution differs, because `trellis` on PyPI is an abandoned 2008
# alpha for something unrelated. See TRE-6.
name = "trellis-kernel"
version = "0.1.0"
description = "Compute project state from a graph of work, gates, and contracts."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# The engine needs none of this; only `trellis log` does.
llm = ["anthropic>=0.69", "pydantic>=2.0"]
# `ruff` is pinned here, and this is the only place the number lives: the commit
# hook pins the same one, and CI installs this extra rather than fetching its
# own, so the three things that can call a change unformatted cannot disagree
# about what passes. A linter is not semver-safe: a new minor adds rules and
# moves formatting, so a floating version turns an unrelated release into a red
# run on a branch that did not change anything.
# `scriv` is floored at the version this convention was verified against
# rather than at a researched minimum. It is only needed by `scriv create`,
# which writes a changelog fragment, and `scriv collect`, which folds the
# fragments into CHANGELOG.md when a version is cut.
dev = [
    "pytest>=8.0",
    "anthropic>=0.69",
    "pydantic>=2.0",
    "ruff==0.14.5",
    "scriv>=1.8",
]

[project.scripts]
trellis = "trellis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trellis*"]

# The operating manual ships with the package. An agent working in someone
# else's repo has `trellis` installed and no copy of this repository, so
# without this the only way to learn the grammar is to go and read the source
# of a project you are not working on. See `trellis brief`.
[tool.setuptools.package-data]
trellis = ["manual.md"]

# One changelog fragment per change, so two branches in flight never write the
# same line of the same file. Every pull request that touched `CHANGELOG.md`
# collided with every other one by construction; a file whose name nobody else
# will choose cannot. See TRE-31.
[tool.scriv]
fragment_directory = "changelog.d"
format = "md"
# The changelog's version headings are `##` and its categories `###`. scriv
# writes categories one level below this, so this is the version level.
md_header_level = "2"
# Keep a Changelog's order, which is not scriv's own — it leads with Removed.
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Assigning a lambda is fine in the small places we do it.
    "E731",
]

[tool.ruff.lint.pycodestyle]
# ruff format wraps code to 88; only unsplittable strings and comments run over.
max-line-length = 92

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures and modules late on purpose, and shadow names freely.
"tests/*" = ["E402", "F811"]
