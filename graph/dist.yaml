nodes:
  - id: dist.release_process
    ref: "#8"
    title: Decide tagging, releases, and whether PyPI happens
    status: not_started
    awaiting: whether trellis publishes to PyPI under another distribution name
    notes: >
      Deliberately unparented: it belongs to no feature, which is itself
      the diagnostic - nobody owns distribution yet.

  - id: core.concurrency
    ref: "#7"
    title: Lock the writer against concurrent edits
    status: not_started
    notes: >
      Known limitation, understood and documented. It has no edges because
      nothing genuinely waits on it. `check` will call it inert, which is true
      - acknowledging that is a call for whoever owns this, not for the agent
      that wrote the file.
