nodes:
  - id: trust
    title: Being reliably suspicious
    status: in_progress
    publishes:
      history_is_shared: contract.durable_state_home.live
    notes: >
      The retrospective's first read: be the thing that catches you, not the
      thing that replaces you. This is where the roadmap is deliberately
      concentrated.

  - id: trust.journal_home
    ref: "#28"
    title: Make the why survive a clone
    parent: trust
    status: done
    provides: [shared-history]
    notes: >
      Nobody has hit this because the tool has been used from one working
      copy. It bites the first time two people share a graph.

  - id: trust.reconcile_loop
    ref: "#40"
    title: Capture whether a checked edge held or was wrong
    parent: trust
    status: not_started
    provides: [reconciliation-outcome]
    notes: >
      Surfaced by this graph rather than by a person: the contract had two
      consumers and nothing implementing it. The outcome is not recoverable
      from the files, because the wrong case deletes the evidence of its own
      failure.

  - id: trust.honest_output
    ref: "#41"
    title: Audit output for conclusions the tool has not verified
    parent: trust
    status: not_started
    notes: >
      Two messages stated diagnoses drawn from lookups that could not have
      succeeded. Both fixed; the pattern is not audited. We apply
      challenge-never-assert to the user's declarations and had not been
      applying it to our own output.

  - id: trust.calibration
    ref: TRE-1  #19"
    title: Report how often unconfirmed edges were wrong
    parent: trust
    status: not_started
    gates:
      start: contract.reconcile_outcome.live
    evidence:
      contract.reconcile_outcome: stated
    notes: >
      Measured once already: 2 of 7 unconfirmed edges were wrong, 0 of 29
      verified ones were. The number is the product's proof.

  - id: trust.node_identity
    ref: "#39"
    title: Say which external item a node is
    parent: trust
    status: done
    provides: [external-identity]
    notes: >
      Identity, not grounding: *which thing is this*, rather than *is this
      claim still true*. Today it lives in the title, so a reworded title
      breaks the join and a parallel table cannot be deleted.

  - id: trust.external_grounding
    ref: TRE-3  #4"
    title: Challenge a declaration with branch and PR state
    parent: trust
    status: not_started
    provides: [repo-evidence]
    gates:
      start: has(trust.node_identity, "external-identity")
    evidence:
      trust.node_identity: stated
    notes: >
      Two signals, both challenge-only. Deliberately not a full
      integration - the value is in the challenge, not the coverage.

  - id: trust.structural_critique
    ref: TRE-4  #5"
    title: Co-movement and fan-in
    parent: trust
    status: not_started
    gates:
      start: has(trust.journal_home, "shared-history")
    evidence:
      trust.journal_home: inferred
    notes: >
      Co-movement reads the journal's history, so it needs the journal to
      be a thing that persists. That edge is inferred, not confirmed.
