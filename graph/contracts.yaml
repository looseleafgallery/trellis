# Contracts first: these are the things two pieces of work have to agree on
# before either can be finished. Modelled before the work, per AGENTS.md,
# because a contract is the thing that was argued about.

nodes:
  - id: contract.durable_state_home
    title: Where durable coordination state lives
    kind: contract
    status: agreed
    version: 1
    satisfied_by: [trust.journal_home]
    notes: >
      Settled: durable and derived are split. The journal is committed in
      history/; the cache stays in .trellis/ and stays ignored. Implemented in
      #34, which also made a graph with no journal say so rather than quietly
      answering a weaker question.

      Originally: the journal is in .trellis/, which is gitignored, so correction reasons
      and the drift baseline never leave one machine. A proposal awaiting a
      human decision is a handoff between two parties, so it cannot live
      somewhere the other party cannot see. Both questions are the same
      question, and neither piece of work can be finished until it is answered.
      Nobody has drafted this - see #28.

  - id: contract.reconcile_outcome
    title: How the outcome of checking an edge is recorded
    kind: contract
    status: agreed
    version: 0
    satisfied_by: [trust.reconcile_loop]
    notes: >
      Calibration needs to know whether a checked edge held or was wrong. The
      wrong case usually deletes the evidence of its own failure, so the
      outcome has to be captured deliberately rather than inferred. The
      proposal queue needs the same shape for accept and reject, so this is one
      agreement, not two. See #19.

  - id: contract.beliefs_in_the_model
    ref: TRE-5
    title: Whether trellis models beliefs, not just commitments
    kind: contract
    status: draft
    version: 0
    notes: >
      A decision that is done and still moving has no word. Making it
      gate-readable puts a time-dependent value inside a content-hash cache
      key, which is the property that makes the engine trustworthy. Keeping it
      in the trust layer keeps the engine honest but gives up the useful gate.
      This is the one that decides whether the roadmap goes further into
      beliefs at all.

  - id: contract.decision_surface
    title: What a decision must tell you before you make it
    kind: contract
    status: agreed
    version: 0
    satisfied_by: [hitl.decision_context]
    notes: >
      From the product owner, 22 Aug: a person choosing between options must
      see the side effects each one produces, and as much context as the graph
      already holds.

      Modelled as a contract rather than a task because it binds every surface
      that asks a person to decide - `review`, `reconcile`, and the proposal
      queue - so it is one agreement rather than three conventions that drift.

      Earned the hard way: `acknowledge` was chosen for five findings on the
      strength of a one-word label, and its actual side effect - a permanent
      ruling, visible to everyone, that suppresses the finding for good - was
      never stated at the point of choosing.

